# Beispiel: Spoolman + ace-lane-bridge (z.B. als Portainer-Stack oder mit `docker compose up -d`)
services:
  spoolman:
    image: ghcr.io/donkie/spoolman:0.26.1
    container_name: spoolman
    restart: unless-stopped
    ports:
      - "7912:8000"
    volumes:
      - ./spoolman:/home/app/.local/share/spoolman
    environment:
      TZ: Europe/Berlin

  ace-lane-bridge:
    image: ghcr.io/xnovosx/ace-lane-bridge:latest
    container_name: ace-lane-bridge
    restart: unless-stopped
    # user: "0:0"                                 # falls ./bridge-data root gehoert (Image laeuft als 1000)
    ports:
      - "7913:7913"
    volumes:
      - ./bridge-data:/data
    environment:
      MOONRAKER_URL: "http://192.168.1.50:7125"   # <- IP des Klipper-Pi (Moonraker)
      SPOOLMAN_URL: "http://spoolman:8000"       # im selben Stack ueber den Servicenamen
      TZ: Europe/Berlin
      # KI-Fehldruck-Erkennung (optional, Dienst unten):
      # VISION_URL: "http://kobra-vision:7917"
      # Home Assistant ueber MQTT (optional; Geraet erscheint per Discovery von selbst):
      # MQTT_HOST: "192.168.1.10"
      # MQTT_USER: "kobra"
      # MQTT_PASSWORD: "..."
      # ROOM_SENSOR_TOPIC: "zigbee2mqtt/Filamentlager"   # Feuchte im Lagerraum fuer die Spulen-Schaetzung
    depends_on:
      - spoolman

  # Optional: KI-Fehldruck-Erkennung (Obicos Modell, laeuft auf der CPU, ~50 ms pro Bild).
  # Die Bridge schickt ihr im Druck alle 10 s ein Kamerabild; der Drucker merkt davon nichts.
  # kobra-vision:
  #   image: ghcr.io/xnovosx/kobra-vision:latest
  #   container_name: kobra-vision
  #   restart: unless-stopped
  #   environment:
  #     THREADS: "2"            # CPU-Kerne fuer die Erkennung
  #     UNLOAD_AFTER_S: "600"   # Modell nach 10 min ohne Druck entladen (Speicher frei)
