# Example: Spoolman + ace-lane-bridge (e.g. as a Portainer stack or with `docker compose up -d`)
services:
  spoolman:
    image: ghcr.io/donkie/spoolman:0.26.1
    container_name: spoolman
    restart: unless-stopped
    ports:
      - "7912:8000"
    volumes:
      - ./spoolman:/home/app/.local/share/spoolman
    environment:
      TZ: Europe/Berlin

  ace-lane-bridge:
    image: ghcr.io/xnovosx/ace-lane-bridge:latest
    container_name: ace-lane-bridge
    restart: unless-stopped
    # user: "0:0"                                 # if ./bridge-data belongs to root (the image runs as 1000)
    ports:
      - "7913:7913"
    volumes:
      - ./bridge-data:/data
    environment:
      MOONRAKER_URL: "http://192.168.1.50:7125"   # <- IP of your printer's Moonraker (Klipper Pi or Rinkhals)
      SPOOLMAN_URL: "http://spoolman:8000"       # in the same stack via the service name
      TZ: Europe/Berlin
      # UI_LANGUAGE: "de"                        # default language of web UI and display (en | de), per device changeable
      # AI failure detection (optional, service below):
      # VISION_URL: "http://kobra-vision:7917"
      # Home Assistant via MQTT (optional; the device appears by itself via discovery):
      # MQTT_HOST: "192.168.1.10"
      # MQTT_USER: "kobra"
      # MQTT_PASSWORD: "..."
      # ROOM_SENSOR_TOPIC: "zigbee2mqtt/filament_storage"   # humidity in the storage room for the spool estimate
    depends_on:
      - spoolman

  # Optional: AI failure detection (Obico's model, runs on the CPU, ~50 ms per image).
  # During a print the bridge sends it a camera image every 10 s; the printer notices nothing of it.
  # kobra-vision:
  #   image: ghcr.io/xnovosx/kobra-vision:latest
  #   container_name: kobra-vision
  #   restart: unless-stopped
  #   environment:
  #     THREADS: "2"            # CPU cores for the detection
  #     UNLOAD_AFTER_S: "600"   # unload the model after 10 min without a print (frees memory)
