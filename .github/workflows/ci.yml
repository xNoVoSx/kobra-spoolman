name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten
        run: pip install -r bridge/app/requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # SDK mit angenommenen Lizenzen; fehlende Plattformen laedt das Android-Gradle-Plugin selbst
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests und Debug-APK
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v7
        with:
          name: kobra-spoolman-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck bridge/app/entrypoint.sh
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
