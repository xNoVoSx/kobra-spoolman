# Builds the Docker images of the bridge (ghcr.io/<owner>/ace-lane-bridge) and of the AI service
# (ghcr.io/<owner>/kobra-vision, CPU; the model is downloaded and checked while building).
#   - push to main      -> tag "edge"
#   - Tag vX.Y.Z        -> tags "X.Y.Z", "X.Y", "latest" - with the signed app APK in the image
#                          (the bridge offers it to the app as an update, /api/app/update)
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "bridge/**"
      - "vision/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BASE_SRC: python:3.12-slim       # official image; must match the default ARG BASE in bridge/ and vision/Dockerfile

jobs:
  # one copy of the Python base image in GitHub's own registry for both images: anonymous pulls from the AWS mirror
  # hit its data limit (429 "Data limit exceeded", 4.0.1 and 4.1.0) when the two builds pull at once on shared runners.
  # Tries the AWS mirror, then Docker Hub, with pauses; if both fail, the copy from an earlier run is used.
  base:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.copy.outputs.image }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: copy
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          dst="ghcr.io/${owner}/kobra-spoolman-base:${BASE_SRC/:/-}"
          echo "image=$dst" >> "$GITHUB_OUTPUT"
          for wait in 0 30 90 180; do
            sleep "$wait"
            for src in "public.ecr.aws/docker/library/$BASE_SRC" "docker.io/library/$BASE_SRC"; do
              if docker buildx imagetools create --tag "$dst" "$src"; then
                echo "Base image: $src -> $dst"; exit 0
              fi
            done
          done
          echo "::warning::could not refresh the base image, using the copy from an earlier run"
          docker buildx imagetools inspect "$dst" > /dev/null

  app:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/apk.yml
    secrets: inherit

  image:
    needs: [app, base]
    # also without the APK job (push to main): then an image without an app update
    if: ${{ !cancelled() && needs.base.result == 'success' && (needs.app.result == 'success' || needs.app.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: app
          path: bridge/app/acebridge/appdist

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ace-lane-bridge
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: bridge
          platforms: linux/amd64,linux/arm64
          build-args: BASE=${{ needs.base.outputs.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  vision:
    needs: base
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kobra-vision
          tags: |
            type=edge,branch=main
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: vision
          platforms: linux/amd64,linux/arm64
          build-args: BASE=${{ needs.base.outputs.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vision
          cache-to: type=gha,mode=max,scope=vision
